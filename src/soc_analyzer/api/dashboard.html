<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC Log Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'], mono: ['IBM Plex Mono','monospace'] } } }
        }
    </script>
    <style>
        body { background: #0a0e17; color: #e2e8f0; font-family: Inter, system-ui, sans-serif; }
        .card { background: #111827; border: 1px solid #1e293b; border-radius: 0.75rem; }
        @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }
        .scrollbar-thin::-webkit-scrollbar { width: 4px; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
        .modal-overlay { background: rgba(0,0,0,0.75); }
    </style>
</head>
<body>
<div class="min-h-screen px-6 py-6 max-w-[1400px] mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-indigo-500/20 flex items-center justify-center text-indigo-400 text-xl font-bold">S</div>
            <div>
                <h1 class="text-lg font-semibold tracking-tight text-white">SOC Log Analyzer</h1>
                <p class="text-xs text-gray-500" id="status-line">Connecting...</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="runCorrelate()" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-gray-800 border border-gray-700 hover:border-gray-500 transition" id="btn-correlate">Correlate</button>
            <button onclick="runPipeline()" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-500 transition" id="btn-pipeline">Run Pipeline</button>
        </div>
    </div>

    <!-- Error banner -->
    <div id="error-banner" class="hidden mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm"></div>

    <!-- Stats Row -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6" id="stats-row">
        <div class="card p-5"><p class="text-xs text-gray-500 mb-1">Total Events</p><p class="text-3xl font-bold font-mono text-white" id="stat-events">-</p></div>
        <div class="card p-5"><p class="text-xs text-gray-500 mb-1">Incidents</p><p class="text-3xl font-bold font-mono text-white" id="stat-incidents">-</p><p class="text-xs text-gray-500 mt-1" id="stat-incidents-sub"></p></div>
        <div class="card p-5"><p class="text-xs text-gray-500 mb-1">Critical</p><p class="text-3xl font-bold font-mono text-red-500" id="stat-critical">-</p></div>
        <div class="card p-5"><p class="text-xs text-gray-500 mb-1">Reports</p><p class="text-3xl font-bold font-mono text-indigo-400" id="stat-reports">-</p></div>
    </div>

    <!-- Charts Row -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="card p-5">
            <h3 class="text-sm font-medium text-gray-400 mb-3">Events by Severity</h3>
            <canvas id="chart-severity" height="200"></canvas>
        </div>
        <div class="card p-5">
            <h3 class="text-sm font-medium text-gray-400 mb-3">Attack Categories</h3>
            <canvas id="chart-attacks" height="200"></canvas>
        </div>
        <div class="card p-5">
            <h3 class="text-sm font-medium text-gray-400 mb-3">Top Source IPs</h3>
            <div id="top-ips" class="space-y-2 mt-2"></div>
        </div>
    </div>

    <!-- Incidents Table -->
    <div class="card overflow-hidden mb-6" id="incidents-section" style="display:none">
        <div class="px-5 py-3 border-b border-gray-800 flex items-center justify-between">
            <h3 class="text-sm font-medium text-gray-400">Incidents</h3>
            <span class="text-xs text-gray-600 font-mono" id="incidents-count"></span>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead>
                    <tr class="text-xs text-gray-600 border-b border-gray-800">
                        <th class="py-2 px-4 font-medium">ID</th>
                        <th class="py-2 px-3 font-medium">Severity</th>
                        <th class="py-2 px-4 font-medium">Title</th>
                        <th class="py-2 px-4 font-medium text-center">Events</th>
                        <th class="py-2 px-4 font-medium">Sources</th>
                        <th class="py-2 px-4 font-medium">Kill Chain</th>
                        <th class="py-2 px-4 font-medium"></th>
                    </tr>
                </thead>
                <tbody id="incidents-body"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Report Modal -->
<div id="report-modal" class="fixed inset-0 modal-overlay hidden z-50 flex items-center justify-center p-4" onclick="closeModal()">
    <div class="card max-w-3xl w-full max-h-[85vh] overflow-y-auto scrollbar-thin p-6" onclick="event.stopPropagation()">
        <div class="flex items-center justify-between mb-4">
            <div>
                <span id="modal-badge" class="px-2 py-0.5 rounded text-xs font-mono font-medium border"></span>
                <h2 class="text-lg font-semibold mt-2" id="modal-title"></h2>
                <p class="text-xs text-gray-500 font-mono mt-1" id="modal-meta"></p>
            </div>
            <button onclick="closeModal()" class="text-gray-500 hover:text-white text-2xl leading-none">&times;</button>
        </div>
        <div id="modal-body" class="space-y-4 text-sm text-gray-300 leading-relaxed"></div>
    </div>
</div>

<script>
const SEV_COLORS = { critical:'#ef4444', high:'#f59e0b', medium:'#3b82f6', low:'#6b7280', benign:'#22c55e' };
const SEV_BADGE = { critical:'bg-red-500/20 text-red-400 border-red-500/30', high:'bg-amber-500/20 text-amber-400 border-amber-500/30', medium:'bg-blue-500/20 text-blue-400 border-blue-500/30', low:'bg-gray-500/20 text-gray-400 border-gray-500/30', benign:'bg-green-500/20 text-green-400 border-green-500/30' };

let chartSev = null, chartAtk = null;
let incidents = [], reports = [], ollamaAvailable = false;

async function fetchJSON(url, opts) {
    const res = await fetch(url, opts);
    if (!res.ok) throw new Error(await res.text());
    return res.json();
}

function showError(msg) { const b = document.getElementById('error-banner'); b.textContent = msg; b.classList.remove('hidden'); }
function hideError() { document.getElementById('error-banner').classList.add('hidden'); }
function setBtn(id, text, disabled) { const b = document.getElementById(id); b.textContent = text; b.disabled = disabled; if(disabled) b.style.opacity='0.5'; else b.style.opacity='1'; }

async function loadDashboard() {
    try {
        const [health, stats, inc, rep] = await Promise.all([
            fetchJSON('/health'), fetchJSON('/api/stats'),
            fetchJSON('/api/incidents'), fetchJSON('/api/reports'),
        ]);
        incidents = inc; reports = rep; ollamaAvailable = health.ollama_available;
        const dot = health.ollama_available ? '<span class="inline-block w-1.5 h-1.5 rounded-full bg-green-500 pulse-dot mr-1"></span>Ollama: '+health.ollama_model : '<span class="inline-block w-1.5 h-1.5 rounded-full bg-gray-600 mr-1"></span>Ollama: offline (using templates)';
        document.getElementById('status-line').innerHTML = dot;
        updateStats(stats, inc, rep);
        renderCharts(stats);
        renderTopIPs(stats.top_source_ips);
        renderIncidents(inc);
        hideError();
    } catch(e) { showError('Cannot connect to API. Is the server running?'); }
}

function updateStats(stats, inc, rep) {
    document.getElementById('stat-events').textContent = (stats.total_events||0).toLocaleString();
    document.getElementById('stat-incidents').textContent = inc.length;
    const crit = inc.filter(i=>i.severity==='critical').length;
    const high = inc.filter(i=>i.severity==='high').length;
    document.getElementById('stat-incidents-sub').textContent = crit+' critical, '+high+' high';
    document.getElementById('stat-critical').textContent = crit;
    document.getElementById('stat-reports').textContent = rep.length;
}

function renderCharts(stats) {
    // Severity bar chart
    const sevLabels = ['critical','high','medium','low','benign'];
    const sevData = sevLabels.map(s => stats.by_severity[s]||0);
    const sevColors = sevLabels.map(s => SEV_COLORS[s]);
    if (chartSev) chartSev.destroy();
    chartSev = new Chart(document.getElementById('chart-severity'), {
        type: 'bar',
        data: { labels: sevLabels, datasets: [{ data: sevData, backgroundColor: sevColors, borderRadius: 4, barPercentage: 0.6 }] },
        options: { responsive:true, plugins:{legend:{display:false},tooltip:{backgroundColor:'#1e293b',borderColor:'#334155',borderWidth:1}}, scales:{x:{ticks:{color:'#9ca3af',font:{family:'IBM Plex Mono',size:11}},grid:{display:false}},y:{ticks:{color:'#6b7280',font:{family:'IBM Plex Mono',size:11}},grid:{color:'#1e293b'}}} }
    });

    // Attack donut chart
    const atkEntries = Object.entries(stats.by_attack_category||{}).filter(([k])=>k!=='benign'&&k!=='unknown').sort((a,b)=>b[1]-a[1]).slice(0,8);
    const atkColors = ['#ef4444','#f59e0b','#3b82f6','#818cf8','#22c55e','#f472b6','#fb923c','#a78bfa'];
    if (chartAtk) chartAtk.destroy();
    if (atkEntries.length > 0) {
        chartAtk = new Chart(document.getElementById('chart-attacks'), {
            type: 'doughnut',
            data: { labels: atkEntries.map(([k])=>k.replace(/_/g,' ')), datasets: [{ data: atkEntries.map(([,v])=>v), backgroundColor: atkColors.slice(0,atkEntries.length), borderWidth:0 }] },
            options: { responsive:true, cutout:'55%', plugins:{legend:{position:'bottom',labels:{color:'#9ca3af',font:{size:10},boxWidth:10,padding:8}},tooltip:{backgroundColor:'#1e293b',borderColor:'#334155',borderWidth:1}} }
        });
    }
}

function renderTopIPs(ips) {
    const el = document.getElementById('top-ips');
    const filtered = (ips||[]).filter(ip=>ip.src_ip);
    el.innerHTML = filtered.slice(0,8).map(ip =>
        '<div class="flex items-center justify-between"><span class="font-mono text-sm text-gray-300">'+ip.src_ip+'</span><span class="font-mono text-xs text-gray-500">'+ip.count.toLocaleString()+'</span></div>'
    ).join('');
}

function renderIncidents(inc) {
    const section = document.getElementById('incidents-section');
    if (!inc.length) { section.style.display='none'; return; }
    section.style.display='block';
    document.getElementById('incidents-count').textContent = inc.length+' total';
    const body = document.getElementById('incidents-body');
    body.innerHTML = inc.map(i => {
        const badge = SEV_BADGE[i.severity]||SEV_BADGE.low;
        const stages = (i.attack_stages||[]).filter(s=>s!=='unknown').join(' → ')||'-';
        return '<tr class="border-b border-gray-800/50 hover:bg-white/[0.02] transition-colors">'+
            '<td class="py-3 px-4 font-mono text-xs text-gray-500">'+i.id.slice(0,16)+'</td>'+
            '<td class="py-3 px-3"><span class="px-2 py-0.5 rounded text-xs font-mono font-medium border '+badge+'">'+i.severity.toUpperCase()+'</span></td>'+
            '<td class="py-3 px-4 text-sm max-w-md truncate">'+i.title+'</td>'+
            '<td class="py-3 px-4 font-mono text-sm text-center">'+i.event_count+'</td>'+
            '<td class="py-3 px-4 font-mono text-xs text-gray-400">'+(i.source_ips||[]).slice(0,2).join(', ')+'</td>'+
            '<td class="py-3 px-4 text-xs text-gray-400">'+stages+'</td>'+
            '<td class="py-3 px-4"><button onclick="generateReport(\''+i.id+'\')" class="text-xs px-2 py-1 rounded bg-indigo-500/20 text-indigo-400 hover:bg-indigo-500/30 transition font-medium">Report</button></td>'+
            '</tr>';
    }).join('');
}

async function runCorrelate() {
    setBtn('btn-correlate','Correlating...',true); hideError();
    try {
        incidents = await fetchJSON('/api/correlate',{method:'POST'});
        renderIncidents(incidents);
        const stats = await fetchJSON('/api/stats');
        updateStats(stats, incidents, reports);
    } catch(e) { showError(e.message); }
    setBtn('btn-correlate','Correlate',false);
}

async function runPipeline() {
    const provider = ollamaAvailable ? 'ollama' : 'template';
    setBtn('btn-pipeline','Running...',true); hideError();
    try {
        const data = await fetchJSON('/api/pipeline?provider='+provider,{method:'POST'});
        incidents = data.incidents; reports = data.reports;
        updateStats(data.stats, incidents, reports);
        renderCharts(data.stats);
        renderTopIPs(data.stats.top_source_ips);
        renderIncidents(incidents);
    } catch(e) { showError(e.message); }
    setBtn('btn-pipeline','Run Pipeline',false);
}

async function generateReport(incidentId) {
    const provider = ollamaAvailable ? 'ollama' : 'template';
    try {
        const report = await fetchJSON('/api/summarize/'+incidentId+'?provider='+provider,{method:'POST'});
        reports.push(report);
        document.getElementById('stat-reports').textContent = reports.length;
        showReportModal(report);
    } catch(e) { showError(e.message); }
}

function showReportModal(r) {
    const modal = document.getElementById('report-modal');
    const badge = document.getElementById('modal-badge');
    badge.className = 'px-2 py-0.5 rounded text-xs font-mono font-medium border '+(SEV_BADGE[r.severity]||'');
    badge.textContent = r.severity.toUpperCase();
    document.getElementById('modal-title').textContent = r.title;
    document.getElementById('modal-meta').textContent = r.incident_id+' \u00B7 '+r.generator;

    let html = '<div><h3 class="text-xs font-medium text-gray-500 mb-1">Executive Summary</h3><p>'+esc(r.executive_summary)+'</p></div>';
    if (r.timeline_narrative) html += '<div><h3 class="text-xs font-medium text-gray-500 mb-1">Timeline</h3><p class="whitespace-pre-line">'+esc(r.timeline_narrative)+'</p></div>';
    if (r.impact_assessment) html += '<div><h3 class="text-xs font-medium text-gray-500 mb-1">Impact Assessment</h3><p class="whitespace-pre-line">'+esc(r.impact_assessment)+'</p></div>';
    if (r.iocs && r.iocs.length) {
        html += '<div><h3 class="text-xs font-medium text-gray-500 mb-2">Indicators of Compromise</h3><table class="w-full text-xs"><thead><tr class="text-gray-500 border-b border-gray-800"><th class="text-left py-1">Type</th><th class="text-left py-1">Value</th><th class="text-left py-1">Action</th></tr></thead><tbody>';
        r.iocs.forEach(ioc => {
            const ac = ioc.action==='block'?'bg-red-500/20 text-red-400':'bg-blue-500/20 text-blue-400';
            html += '<tr class="border-b border-gray-800/50"><td class="py-1.5 text-gray-400">'+esc(ioc.type)+'</td><td class="py-1.5 font-mono text-gray-300">'+esc(ioc.value)+'</td><td class="py-1.5"><span class="px-1.5 py-0.5 rounded text-[10px] font-medium '+ac+'">'+esc(ioc.action)+'</span></td></tr>';
        });
        html += '</tbody></table></div>';
    }
    if (r.response_actions && r.response_actions.length) {
        html += '<div><h3 class="text-xs font-medium text-gray-500 mb-2">Response Actions</h3><div class="space-y-2">';
        r.response_actions.sort((a,b)=>a.priority-b.priority).forEach(a => {
            const dot = a.priority===1?'bg-red-500':a.priority===2?'bg-amber-500':'bg-blue-500';
            html += '<div class="flex gap-2 items-start"><span class="shrink-0 mt-1 w-2 h-2 rounded-full '+dot+'"></span><div><p class="text-gray-300">'+esc(a.action)+'</p>'+(a.rationale?'<p class="text-gray-500 text-xs mt-0.5">'+esc(a.rationale)+'</p>':'')+'</div></div>';
        });
        html += '</div></div>';
    }
    if (r.mitre_techniques && r.mitre_techniques.length) {
        html += '<div><h3 class="text-xs font-medium text-gray-500 mb-2">MITRE ATT&CK</h3><div class="flex flex-wrap gap-1.5">';
        r.mitre_techniques.forEach(t => { html += '<span class="px-2 py-0.5 bg-indigo-500/10 text-indigo-400 text-xs rounded font-mono">'+esc(t)+'</span>'; });
        html += '</div></div>';
    }
    document.getElementById('modal-body').innerHTML = html;
    modal.classList.remove('hidden');
}

function closeModal() { document.getElementById('report-modal').classList.add('hidden'); }
function esc(s) { if(!s)return''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// Load on page ready
loadDashboard();
</script>
</body>
</html>
